version: 2
updates:
  - package-ecosystem: github-actions
    directories: ["/", "/acciones/*"]
    # Una PR al mes con todas las acciones: su CI gasta cuota (mariomina/mario-home#134) y espera veredicto y
    # permiso como una PR de trabajo. Una versión nueva espera 7 días antes de proponerse: una versión
    # comprometida suele detectarse y retirarse antes.
    schedule:
      interval: monthly
    groups:
      acciones:
        patterns: ["*"]
    cooldown:
      default-days: 7
    labels: ["area/ci"]
    # fix(deps) y no chore: chore no publica versión, y los repos que llaman con @v1 se quedarían con el SHA viejo.
    commit-message:
      prefix: fix
      include: scope
