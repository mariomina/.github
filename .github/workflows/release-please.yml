# Workflow reutilizable: versión, changelog y release desde los commits de main.
# Necesita «Allow GitHub Actions to create and approve pull requests» en el repo que lo llama.
name: release-please

on:
  workflow_call:
    inputs:
      release-type:
        type: string
        default: simple

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          release-type: ${{ inputs.release-type }}
