# Workflow reutilizable: versión, changelog y release desde los commits de main.
# El repo que lo llama tiene release-please-config.json y .release-please-manifest.json en su raíz
# (componentes, changelog-sections y archivos de versión). Necesita «Allow GitHub Actions to create
# and approve pull requests» en el repo (en la org ya está activado).
# La PR de versión se fusiona sola (decisión de Mario, mariomina/2-cerebro#280): el merge con GITHUB_TOKEN
# no dispara otro workflow, así que una segunda pasada de release-please publica la versión en esta misma
# ejecución. Si la fusión falla, el job falla; el barrido de home-mario (mantenimiento.yml) la reintenta y lo avisa.
name: release-please

on:
  workflow_call:
    inputs:
      config-file:
        type: string
        default: release-please-config.json
      manifest-file:
        type: string
        default: .release-please-manifest.json
    outputs:
      releases_created:
        value: ${{ jobs.release-please.outputs.releases_created }}
      major:
        value: ${{ jobs.release-please.outputs.major }}

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    outputs:
      releases_created: ${{ steps.rp.outputs.releases_created == 'true' || steps.rp2.outputs.releases_created == 'true' }}
      major: ${{ steps.rp2.outputs.major || steps.rp.outputs.major }}
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        id: rp
        with:
          config-file: ${{ inputs.config-file }}
          manifest-file: ${{ inputs.manifest-file }}
      # La fusión es `github_pendientes.py --fusionar-version` (con tests en scripts/tests), desde la rama
      # principal de mariomina/.github, como agents-md.yml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.rp.outputs.prs_created == 'true'
        with:
          repository: mariomina/.github
          path: .mantenimiento
          sparse-checkout: scripts/github_pendientes.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Fusionar la PR de versión
        id: fusion
        if: steps.rp.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PRS: ${{ steps.rp.outputs.prs }}
        run: python3 -I .mantenimiento/scripts/github_pendientes.py --fusionar-version
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        id: rp2
        if: ${{ !cancelled() && steps.fusion.outputs.fusionadas != '' && steps.fusion.outputs.fusionadas != '0' }}
        with:
          config-file: ${{ inputs.config-file }}
          manifest-file: ${{ inputs.manifest-file }}
          skip-github-pull-request: true
      - name: Comprobar que la versión se publicó
        if: ${{ !cancelled() && steps.fusion.outputs.fusionadas != '' && steps.fusion.outputs.fusionadas != '0' && steps.rp2.outputs.releases_created != 'true' }}
        run: |
          echo "::error::Se fusionó la PR de versión, pero release-please no publicó la versión en la segunda pasada"
          exit 1
