# Workflow reutilizable: CI de Python con uv.
# Si el repo no tiene pyproject.toml, solo comprueba que no quedan marcas de conflicto.
name: ci-python

on:
  workflow_call:
    inputs:
      python-version:
        type: string
        default: "3.12"

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Sin marcas de conflicto
        run: |
          rc=0
          git grep -nE '^(<<<<<<<|>>>>>>>) ' -- . ':!*.lock' || rc=$?
          if [ "$rc" -eq 0 ]; then echo "::error::Quedan marcas de conflicto"; exit 1; fi
          if [ "$rc" -gt 1 ]; then echo "::error::git grep falló ($rc)"; exit "$rc"; fi
      - name: Detectar Python
        id: py
        run: |
          if [ -f pyproject.toml ]; then echo "hay=true" >> "$GITHUB_OUTPUT"; else echo "hay=false" >> "$GITHUB_OUTPUT"; fi
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: steps.py.outputs.hay == 'true'
        with:
          python-version: ${{ inputs.python-version }}
      - name: Instalar
        if: steps.py.outputs.hay == 'true'
        run: |
          if [ -f uv.lock ]; then uv sync --locked --all-extras --dev; else uv sync --all-extras --dev; fi
      - name: Lint
        if: steps.py.outputs.hay == 'true'
        # Usa la versión de ruff del proyecto si la declara; si no, la fijada aquí
        run: if [ -x .venv/bin/ruff ]; then uv run ruff check .; else uv run --with ruff==0.17.5 ruff check .; fi
      - name: Tests
        if: steps.py.outputs.hay == 'true'
        run: |
          if [ ! -d tests ]; then echo "Sin carpeta tests/"; exit 0; fi
          # Usa la versión de pytest del proyecto si la declara; si no, la fijada aquí
          rc=0; if [ -x .venv/bin/pytest ]; then uv run pytest -q || rc=$?; else uv run --with pytest==9.2.0 pytest -q || rc=$?; fi
          # 5 = no se recogió ningún test (repo recién creado)
          if [ "$rc" -eq 5 ]; then echo "Sin tests todavía"; exit 0; fi
          exit "$rc"
