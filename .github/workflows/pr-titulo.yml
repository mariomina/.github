# Workflow reutilizable: el título de la PR sigue Conventional Commits.
name: pr-titulo

on:
  workflow_call:

permissions:
  pull-requests: read

jobs:
  pr-titulo:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: |
            feat
            fix
            docs
            chore
            refactor
            test
            ci
            perf
            build
            revert
            experiment
          requireScope: false
