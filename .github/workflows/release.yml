name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    uses: ./.github/workflows/release-please.yml
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
  # Los repos llaman a los reutilizables con @v<major>: el tag mayor se mueve a cada release.
  tag-mayor:
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-slim
    steps:
      # La versión se publica en la ejecución que dispara el merge de la PR de versión: el tag va a la punta.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Mover v<major>
        run: |
          git tag -f "v${{ needs.release-please.outputs.major }}"
          git push -f origin "v${{ needs.release-please.outputs.major }}"
