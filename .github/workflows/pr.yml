name: pr

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-titulo:
    uses: ./.github/workflows/pr-titulo.yml
  agents-md:
    uses: ./.github/workflows/agents-md.yml
  tests:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tests de los scripts
        run: python3 -B -m unittest discover -s scripts/tests -v
