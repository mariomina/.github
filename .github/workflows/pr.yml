name: pr

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

# Un push nuevo cancela el CI del head superado; un cambio de título (`edited`) no cancela el que corre.
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: ${{ github.event.action != 'edited' }}

jobs:
  pr:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Local: la PR prueba la acción de su propio head
      - uses: ./acciones/pr
      - name: Tests de los scripts
        if: ${{ !cancelled() }}
        run: python3 -B -m unittest discover -s scripts/tests -v
