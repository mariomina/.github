# Workflow reutilizable: el AGENTS.md del repo cumple el filtro global (mariomina/mario-2-cerebro#276).
# Comprueba que existe, que declara tipo-repo y que no exceptúa reglas globales.
# Los duplicados frente a mario-home los revisa el CI de mario-home (necesita leer repos privados).
name: agents-md

on:
  workflow_call:

permissions:
  contents: read

jobs:
  agents-md:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: AGENTS.md
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Los scripts salen del mismo commit que este reutilizable (el @v1 o el SHA del llamador), no de main
          # (mariomina/mario-home#38).
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .filtro
          sparse-checkout: scripts/filtro_global.py
          sparse-checkout-cone-mode: false
      - name: Filtro global (modo repo)
        run: python3 -I .filtro/scripts/filtro_global.py --repo .
