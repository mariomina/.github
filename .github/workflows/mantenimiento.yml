# Barrido de mantenimiento de GitHub cada hora (mariomina/2-cerebro#280). Decisiones de Mario: fusiona las
# PR de versión atascadas (> 10 min sin cambios) y las de Dependabot de parche o menor con CI en verde; lo
# demás (Dependabot mayor, PR de trabajo, avisos) solo se lista en el log. Fusiona con PROJECTS_TOKEN (token
# de Mario): a diferencia de GITHUB_TOKEN, su merge dispara `push` y release-please publica la versión.
# Corre aquí porque el repo es público: sus minutos de Actions no cuentan.
name: mantenimiento

on:
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write  # keepalive: `enable` de los workflows programados

concurrency:
  group: mantenimiento
  cancel-in-progress: false

jobs:
  barrido:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: scripts
      # GitHub desactiva los `schedule` de un repo público tras 60 días sin actividad, y un workflow
      # desactivado no vuelve con ningún trigger. `enable` sobre un workflow activo reinicia ese contador.
      # Si aun así se desactiva, `github_pendientes.py` lo avisa (workflow-desactivado) en la línea GitHub:.
      - name: Mantener vivos los workflows programados
        continue-on-error: true  # un fallo aquí no debe quitar el barrido de esta hora
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows"
          for w in mantenimiento.yml proyectos.yml; do
            estado=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" "$api/$w" | python3 -c 'import json,sys; print(json.load(sys.stdin)["state"])')
            # Solo un workflow activo: uno que Mario apagó a mano (disabled_manually) no se vuelve a encender.
            if [ "$estado" = active ]; then
              curl -fsS -X PUT -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$api/$w/enable"
            fi
            echo "$w: $estado"
          done
      - name: Fusionar lo que se fusiona solo y listar lo demás
        env:
          GH_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
        run: python3 -I scripts/github_pendientes.py --fusionar
