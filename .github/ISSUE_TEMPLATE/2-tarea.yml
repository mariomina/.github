name: Tarea
description: Trabajo concreto que cabe en una rama y una PR.
projects: ["mariomina/2"]
body:
  - type: textarea
    id: resultado
    attributes:
      label: Resultado
      description: ¿Qué debe existir al terminar?
    validations:
      required: true
  - type: textarea
    id: contexto
    attributes:
      label: Contexto
      description: Por qué existe y de qué depende (épica, otro issue).
  - type: textarea
    id: checklist
    attributes:
      label: Checklist
      placeholder: "- [ ] Paso verificable"
    validations:
      required: true
