name: Bug
description: Algo no funciona como debería.
type: Bug
projects: ["mariomina/2"]
body:
  - type: textarea
    id: que-pasa
    attributes:
      label: Qué pasa
      description: Comportamiento actual, con el error exacto si lo hay.
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Qué debería pasar
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducir
      placeholder: "1. …"
    validations:
      required: true
  - type: input
    id: entorno
    attributes:
      label: Entorno
      description: Versión, sistema operativo o datos del runtime.
