name: Mejora
description: Capacidad nueva o mejora de una existente.
type: Mejora
projects: ["mariomina/2"]
body:
  - type: textarea
    id: problema
    attributes:
      label: Problema
      description: Quién tiene el problema y qué desea conseguir.
    validations:
      required: true
  - type: textarea
    id: propuesta
    attributes:
      label: Propuesta
    validations:
      required: true
  - type: textarea
